  utilities_roster:
    gas: "Granite Pass Natural Gas"
    water: "Town of Granite Pass Water"
    internet: "Summit Fiber Internet"
    electric: "Kestrel Valley Electric Co-op"

banking_and_liabilities:
  llc_accounts:
    - name: "High Mesa Credit Union Business Checking x4410"
      type: "Checking"
    - name: "Summit Business Card"
      type: "Credit Card"
  personal_or_trust_accounts_relevant_to_funding:
    - "Bluebird Family Trust Checking (Trust / personal)"
    - "Bluebird Family Trust Savings (Trust / personal)"
  autopay_and_transfers:
    notes: >
      Summit Business Card payments are auto-drafted from High Mesa checking.
      Closing funds were wired from the Bluebird Family Trust checking account.

accounting_policy:
  depreciation:
    building_and_improvements_method: "27.5-year residential rental property depreciation"
    land_depreciable: false
  basis_treatment:
    capitalize_to_basis:
      - property inspection / appraisal directly tied to purchased property
      - title company fees
      - escrow / closing fees
      - document recording fees
      - transfer / documentary / filing fees
      - furniture & fixtures conveyed at closing (~$12,000 FF&E bucket)
    expense_current_year:
      - normal utilities
      - routine repairs and maintenance below capitalization threshold
    needs_policy_decision:
      - travel / general search costs for properties not ultimately purchased
      - large repairs >= capitalization_threshold_usd (e.g. HVAC replacement)
  member_equity_rules:
    description: >
      If the member (the Trust / trustee) pays LLC costs personally,
      record:
        Dr Asset or Expense (depending on nature)
        Cr Member Equity – Contributions
      This also applies to funds wired in for cash-to-close.
    prelim_documented_equity_contributions_usd: 12485.00
    equity_contribution_window: "2024-04-01 to 2024-06-30"
    note: >
      This 12,485.00 figure is what we've flagged as personal-to-LLC funding
      around closing. Final number should be reconciled to the settlement
      statement.

close_process:
  bookkeeping_tasks:
    - "Classify each LLC transaction (High Mesa CU, Summit Business Card) as Utilities / Repairs & Maintenance / Capital Improvements / Property Taxes / Closing Costs (Basis) / Bank Charges / etc."
    - "Identify personal transactions that actually belong to the LLC and rebook them as Member Equity."
    - "Tie total Member Equity to cash-to-close / settlement statement."
    - "Generate journal entry for Basis (Land, Building & Improvements, Closing Costs, FF&E)."
    - "Generate depreciation schedule for Building & Improvements (27.5-year)."
    - "Export QuickBooks-ready CSV mapped to COA accounts 1500–5600."

gaps_to_fill:
