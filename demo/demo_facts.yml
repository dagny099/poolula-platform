    Follow the Operating Agreement.
  operating_agreement_on_file: true
  registered_agent_name: "Peakview Registered Agents LLC"
  mailing_address_for_llc: "PO Box 218, Granite Pass, CO 81249"

assets:
  as_of_2024_12_31:
    real_property:
      address: "742 Juniper Bend Court"
      city: "Granite Pass"
      state: "CO"
      zip: "81249"
      acquisition_date: "2024-05-20"
      purchase_price_total_usd: 517500.00
      allocation:
        land_usd: 93150.00
        building_and_improvements_usd: 424350.00
