        Land is non-depreciable. Building & Improvements depreciable under
        residential rental rules. Listed on Airbnb as "Juniper Bend Hideaway".
    other_assets:
      furniture_FF&E_usd: "12000.00 (CLOSE STATEMENT LINE; confirm final)"
