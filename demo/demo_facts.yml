  last_updated: "2025-11-30"
  notes: >
    This is the demo-persona twin of poolula_facts.yml. Every address, name,
    dollar amount, and account below is invented; only the schema and the
    company name are real. This file is the ONLY source of truth for downstream
    generated Q&A in demo mode. If it's not in here, the model should say
    'not documented' instead of hallucinating.

